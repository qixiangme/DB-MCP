name: 보안·안전성 개선
description: 공개해도 안전한 하드닝, 권한, 개인정보, 안전장치 개선을 제안합니다.
title: "[Security] "
labels: ["type: security"]
body:
  - type: markdown
    attributes:
      value: 악용 가능한 취약점은 이 양식 대신 Security Advisory 비공개 제보를 이용하세요.
  - type: textarea
    id: risk
    attributes: {label: 위험 모델, description: 자산, 행위자, 진입점, 영향을 적어 주세요.}
    validations: {required: true}
  - type: textarea
    id: mitigation
    attributes: {label: 완화책, description: 기본 거부, 최소 권한, 입력 검증, 감사 로그 관점에서 적어 주세요.}
    validations: {required: true}
  - type: textarea
    id: validation
    attributes: {label: 검증 방법, description: 음성 테스트와 회귀 테스트를 포함해 주세요.}
    validations: {required: true}
