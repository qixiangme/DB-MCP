name: 버그 신고
description: 재현 가능한 오동작이나 회귀를 신고합니다.
title: "[Bug] "
labels: ["type: bug"]
body:
  - type: textarea
    id: summary
    attributes: {label: 현상, description: 기대한 동작과 실제 동작을 함께 적어 주세요.}
    validations: {required: true}
  - type: textarea
    id: reproduce
    attributes: {label: 최소 재현 절차, placeholder: "1. ...\n2. ...\n3. ..."}
    validations: {required: true}
  - type: input
    id: revision
    attributes: {label: 버전 또는 커밋, placeholder: "git rev-parse --short HEAD"}
    validations: {required: true}
  - type: textarea
    id: environment
    attributes: {label: 환경, description: OS, Java, 모델, MCP 서버 구현체와 관련 환경변수를 적어 주세요.}
    validations: {required: true}
  - type: textarea
    id: evidence
    attributes: {label: 로그·증거, description: 비밀정보를 제거한 로그, 응답, 스크린샷을 첨부해 주세요.}
  - type: checkboxes
    id: security
    attributes:
      label: 보안 확인
      options:
        - label: 공개하면 위험한 취약점이나 비밀정보가 포함되지 않았습니다.
          required: true
  - type: dropdown
    id: evaluation_category
    attributes:
      label: 주 평가항목
      description: 수정이 가장 직접적으로 개선할 평가항목을 선택해 주세요.
      options:
        - 프로젝트 구조 및 코드 완성도
        - 오픈소스 프로젝트의 발전 가능성
        - 개발 문서의 구체성
        - 프로젝트 혁신성
        - 프로젝트 팀워크
    validations: {required: true}
  - type: textarea
    id: evaluation_impact
    attributes:
      label: 0.1점 이상 개선 가설과 근거
      description: 현재 문제, 평가 문구와의 연결, 예상 상승 폭, 수정 전후 증거를 적어 주세요. 점수는 확정값이 아닌 가설로 표현합니다.
    validations: {required: true}
  - type: dropdown
    id: secondary_evaluation_category
    attributes:
      label: 보조 평가항목
      options: [없음, 프로젝트 구조 및 코드 완성도, 오픈소스 프로젝트의 발전 가능성, 개발 문서의 구체성, 프로젝트 혁신성, 프로젝트 팀워크]
    validations: {required: true}
  - type: input
    id: baseline_branch
    attributes: {label: 기준 브랜치, description: 재현과 수정 전후 비교의 기준 브랜치를 적어 주세요., placeholder: "main"}
    validations: {required: true}
  - type: textarea
    id: current_evidence
    attributes: {label: 현재 문제 증거, description: 최소 재현 결과와 공개 가능한 로그·테스트 근거를 적어 주세요.}
    validations: {required: true}
  - type: textarea
    id: before_after_validation
    attributes: {label: 전후 검증 방법, description: 수정 전 실패와 수정 후 통과를 비교할 명령·결과를 적어 주세요.}
    validations: {required: true}
  - type: textarea
    id: risks_and_rollback
    attributes: {label: 위험과 되돌리기, description: 회귀 범위와 안전한 원복 방법을 적어 주세요.}
    validations: {required: true}
