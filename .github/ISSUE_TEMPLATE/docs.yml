name: 문서
description: README, 가이드, 예제, 다이어그램의 개선을 제안합니다.
title: "[문서] "
labels: ["type: docs"]
body:
  - type: input
    id: location
    attributes: {label: 대상 문서, placeholder: "README.md 또는 URL"}
    validations: {required: true}
  - type: textarea
    id: problem
    attributes: {label: 현재 문제, description: 틀린 내용, 빠진 설명, 따라 하기 어려운 부분을 적어 주세요.}
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes: {label: 제안 내용, description: 독자와 검증 방법까지 적어 주세요.}
    validations: {required: true}
  - type: dropdown
    id: evaluation_category
    attributes:
      label: 주 평가항목
      description: 문서 변경이 가장 직접적으로 개선할 평가항목을 선택해 주세요.
      options:
        - 프로젝트 구조 및 코드 완성도
        - 오픈소스 프로젝트의 발전 가능성
        - 개발 문서의 구체성
        - 프로젝트 혁신성
        - 프로젝트 팀워크
    validations: {required: true}
  - type: textarea
    id: evaluation_impact
    attributes:
      label: 0.1점 이상 개선 가설과 근거
      description: 현재 이해·재현 문제, 평가 문구와의 연결, 예상 상승 폭, 확인 방법을 적어 주세요. 점수는 확정값이 아닌 가설로 표현합니다.
    validations: {required: true}
