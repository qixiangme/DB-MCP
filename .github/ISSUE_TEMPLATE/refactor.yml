name: 리팩터링·유지보수
description: 외부 동작을 유지하는 구조, 빌드, 의존성 개선을 제안합니다.
title: "[리팩터링] "
labels: ["type: refactor"]
body:
  - type: textarea
    id: debt
    attributes: {label: 기술 부채, description: 현재 구조의 비용과 근거를 적어 주세요.}
    validations: {required: true}
  - type: textarea
    id: scope
    attributes: {label: 변경 범위와 비범위, description: 바뀌는 것과 의도적으로 바꾸지 않는 것을 적어 주세요.}
    validations: {required: true}
  - type: textarea
    id: proof
    attributes: {label: 동작 보존 증명, description: 테스트, 벤치마크, 호환성 확인 방법을 적어 주세요.}
    validations: {required: true}
  - type: dropdown
    id: evaluation_category
    attributes:
      label: 주 평가항목
      description: 리팩터링이 가장 직접적으로 개선할 평가항목을 선택해 주세요.
      options:
        - 프로젝트 구조 및 코드 완성도
        - 오픈소스 프로젝트의 발전 가능성
        - 개발 문서의 구체성
        - 프로젝트 혁신성
        - 프로젝트 팀워크
    validations: {required: true}
  - type: textarea
    id: evaluation_impact
    attributes:
      label: 0.1점 이상 개선 가설과 근거
      description: 현재 구조 비용, 평가 문구와의 연결, 예상 상승 폭, 동작 보존 증거를 적어 주세요. 점수는 확정값이 아닌 가설로 표현합니다.
    validations: {required: true}
