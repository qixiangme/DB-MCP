name: 기능 제안
description: 사용자 가치가 있는 새 기능이나 동작 개선을 제안합니다.
title: "[Feature] "
labels: ["type: feature"]
body:
  - type: markdown
    attributes:
      value: 먼저 중복 이슈를 검색하고, 해결책보다 문제와 성공 기준을 명확히 적어 주세요.
  - type: textarea
    id: problem
    attributes:
      label: 문제와 사용자 가치
      description: 누가 어떤 상황에서 무엇 때문에 어려운가요?
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes:
      label: 제안 동작
      description: 입력, 출력, 실패 동작을 예시와 함께 적어 주세요.
    validations: {required: true}
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      placeholder: "- [ ] 기존 동작 회귀 없음\n- [ ] 단위 테스트 추가"
    validations: {required: true}
  - type: textarea
    id: safety
    attributes:
      label: 안전성·호환성 영향
      description: SQL 읽기 전용 가드, 개인정보, 권한, API 호환성, 자원 사용 영향을 적어 주세요.
    validations: {required: true}
  - type: dropdown
    id: evaluation_category
    attributes:
      label: 주 평가항목
      description: 기능이 가장 직접적으로 개선할 평가항목을 선택해 주세요.
      options:
        - 프로젝트 구조 및 코드 완성도
        - 오픈소스 프로젝트의 발전 가능성
        - 개발 문서의 구체성
        - 프로젝트 혁신성
        - 프로젝트 팀워크
    validations: {required: true}
  - type: textarea
    id: evaluation_impact
    attributes:
      label: 0.1점 이상 개선 가설과 근거
      description: 현재 문제, 평가 문구와의 연결, 예상 상승 폭, 기능 전후 검증 방법을 적어 주세요. 점수는 확정값이 아닌 가설로 표현합니다.
    validations: {required: true}
  - type: dropdown
    id: secondary_evaluation_category
    attributes:
      label: 보조 평가항목
      options: [없음, 프로젝트 구조 및 코드 완성도, 오픈소스 프로젝트의 발전 가능성, 개발 문서의 구체성, 프로젝트 혁신성, 프로젝트 팀워크]
    validations: {required: true}
  - type: input
    id: baseline_branch
    attributes: {label: 기준 브랜치, description: 비교·구현의 기준이 되는 브랜치를 적어 주세요., placeholder: "main"}
    validations: {required: true}
  - type: textarea
    id: current_evidence
    attributes: {label: 현재 문제 증거, description: 코드·문서·테스트·벤치마크·운영 기록 중 공개 가능한 근거를 적어 주세요.}
    validations: {required: true}
  - type: textarea
    id: before_after_validation
    attributes: {label: 전후 검증 방법, description: 변경 전후에 비교할 테스트·수치·원시 결과 경로를 적어 주세요.}
    validations: {required: true}
  - type: textarea
    id: risks_and_rollback
    attributes: {label: 위험과 되돌리기, description: 회귀·보안·유지보수 위험과 원복 방법을 적어 주세요.}
    validations: {required: true}
